/* Global search modal — one box across users, listings, orders, tickets. */
function adminSearchModal() {
  openModal(`<h2>Global search</h2><p class="lede">Users, listings, orders and tickets in one place.</p>
    <div class="field"><input id="gsQ" placeholder="Name, ID, email, order or ticket number…" autocomplete="off"></div>
    <div id="gsBody" style="max-height:50vh;overflow:auto"></div>
    <div class="modal-actions"><button class="btn btn-out" id="gsX">Close</button></div>`, true);
  $("#gsX").onclick = closeModal;
  let t;
  $("#gsQ").oninput = () => { clearTimeout(t); t = setTimeout(run, 280); };
  async function run() {
    const q = $("#gsQ").value.trim();
    if (!q) { $("#gsBody").innerHTML = ""; return; }
    const d = await api("/admin/search?q=" + encodeURIComponent(q));
    const section = (title, rows) => rows.length ? `<p style="font-size:12px;font-weight:700;color:var(--muted);
      text-transform:uppercase;letter-spacing:.04em;margin:14px 0 6px">${title}</p>${rows.join("")}` : "";
    $("#gsBody").innerHTML =
      section("Users", d.users.map(u => `<div class="recv-row"><div class="rn"><b>${esc(u.username)}</b>
        <span>Seller#${u.uid} · ${money(u.buyerBalance)}/${money(u.sellerBalance)}</span></div>
        <button class="btn btn-out btn-sm" data-gu="${u.uid}">Manage</button></div>`)) +
      section("Listings", d.listings.map(l => `<div class="recv-row"><div class="rn"><b>${esc(l.name)}</b>
        <span>${money(l.price)} · ${l.status} · Seller#${l.sellerUid}</span></div></div>`)) +
      section("Orders", d.orders.map(o => `<div class="recv-row"><div class="rn"><b>${esc(o.name)}</b>
        <span>${money(o.price)} · ${o.status} · #${o.buyerUid}→#${o.sellerUid}</span></div></div>`)) +
      section("Tickets", d.tickets.map(tk => `<div class="recv-row"><div class="rn"><b>${esc(tk.subject)}</b>
        <span>${tk.no} · ${tk.status}</span></div>
        <button class="btn btn-out btn-sm" data-gt="${tk.no}">Open</button></div>`)) ||
      `<p style="color:var(--muted);font-size:14px;padding:12px 0">No matches.</p>`;
    $("#gsBody").querySelectorAll("[data-gu]").forEach(b => b.onclick = async () => {
      const full = (await api("/admin/users")).users.find(u => u.uid === b.dataset.gu);
      closeModal(); if (full) userEditor(full);
    });
    $("#gsBody").querySelectorAll("[data-gt]").forEach(b => b.onclick = () => {
      closeModal(); location.hash = "#/admin/tickets/" + b.dataset.gt; render();
    });
  }
  $("#gsQ").focus();
}

const PRESETS = ["#EA5B0C", "#E02A35", "#C2185B", "#7B3FE4", "#1B6EF3", "#0E9384", "#1C8C55", "#B07C10", "#3F4652"];
const THEME_FIELDS = [
  { key: "brandColor", id: "brand", label: "Primary", hint: "Buttons, links, prices, the raffle glow — the main colour of the site.", presets: PRESETS },
  { key: "secondaryColor", id: "sec", label: "Secondary", hint: "Outline-button hover state and the seller-balance figure in the header.",
    presets: ["#3F4652", "#5B6472", "#2F3B52", "#4A3B52", "#3B524A", "#52453B", "#454545", "#6B4A52", "#3B4552"] },
  { key: "featuredColor", id: "feat", label: "Featured badge", hint: "The chip shown on listings staff have pinned to the top.",
    presets: ["#191A18", "#B07C10", "#8A3FE4", "#0E6EA8", "#A83232", "#2F7A4A", "#4A4A4A", "#C2185B", "#5B3A29"] },
  { key: "verifiedColor", id: "ver", label: "Verified seller badge", hint: "Shown on listings and accounts staff have marked as verified.",
    presets: ["#1C8C55", "#0E9384", "#1B6EF3", "#7B3FE4", "#B07C10", "#2F7A4A", "#0A7639", "#12A150", "#166E4A"] }
];
async function admAppearance() {
  const { settings } = await api("/admin/settings");
  const live = {}, saved = {};
  THEME_FIELDS.forEach(f => { saved[f.key] = settings[f.key]; live[f.key] = settings[f.key]; });

  $("#admbody").innerHTML = `
    <p class="note info" style="margin:0 0 16px">Everything below previews instantly for you as you drag or type.
      Nothing changes for anyone else until you press Save — and once you do, it reaches every visitor within
      about 20 seconds and is written to disk, so it survives a restart.</p>
    ${THEME_FIELDS.map(f => `<div class="panel" style="max-width:660px;margin-bottom:14px">
      <h3>${f.label}</h3>
      <p style="color:var(--muted);font-size:13.5px;margin-bottom:14px">${f.hint}</p>
      <div class="swatches" data-swatches="${f.id}">${f.presets.map(c =>
        `<button data-c="${c}" style="background:${c}" aria-pressed="${c.toLowerCase() === live[f.key].toLowerCase()}" title="${c}"></button>`).join("")}</div>
      <div class="picker">
        <input type="color" id="wheel_${f.id}" value="${live[f.key]}">
        <div>
          <div class="field" style="margin:0 0 8px"><label for="hex_${f.id}">Hex</label>
            <input id="hex_${f.id}" value="${live[f.key]}" style="width:150px;font-family:ui-monospace,Menlo,monospace"></div>
          <div class="ramp" id="ramp_${f.id}"></div>
        </div>
      </div>
    </div>`).join("")}
    <div class="panel" style="max-width:660px">
      <p style="font-size:13px;color:var(--muted);margin-bottom:11px">Live preview</p>
      <div class="quick">
        <button class="btn btn-solid">Buy now</button>
        <button class="btn btn-out">Secondary hover</button>
        <span class="tag verified">Verified seller</span>
        <span class="tag star">Featured</span>
      </div>
      <div class="quick" style="margin-top:16px">
        <button class="btn btn-solid" id="tSave">Save all colours</button>
        <button class="btn btn-out" id="tReset">Revert unsaved changes</button>
      </div>
    </div>`;

  const rampFor = id => {
    const c = hexToRgb(live[THEME_FIELDS.find(f => f.id === id).key]); if (!c) return;
    $("#ramp_" + id).innerHTML = [toHex(mix(c, WHITE, .22)), toHex(c), toHex(mix(c, BLACK, .28))]
      .map(x => `<i style="background:${x}"></i>`).join("");
  };
  const previewAll = () => applyTheme(live);
  const setField = (f, v) => {
    if (!/^#[0-9a-fA-F]{6}$/.test(v)) return;
    live[f.key] = v; previewAll(); rampFor(f.id);
    document.querySelectorAll(`[data-swatches="${f.id}"] button`).forEach(b =>
      b.setAttribute("aria-pressed", b.dataset.c.toLowerCase() === v.toLowerCase()));
    $("#wheel_" + f.id).value = v; $("#hex_" + f.id).value = v;
  };
  THEME_FIELDS.forEach(f => {
    rampFor(f.id);
    $(`[data-swatches="${f.id}"]`).onclick = e => { const b = e.target.closest("button"); if (b) setField(f, b.dataset.c); };
    $("#wheel_" + f.id).oninput = e => setField(f, e.target.value);
    $("#hex_" + f.id).oninput = e => setField(f, e.target.value.trim());
  });
  $("#tReset").onclick = () => {
    THEME_FIELDS.forEach(f => setField(f, saved[f.key]));
    toast("Reverted — nothing saved.");
  };
  $("#tSave").onclick = () => busy($("#tSave"), async () => {
    await api("/admin/settings", { method: "PATCH", body: { ...live } });
    await refreshMe(); toast("Colours saved — going live for everyone.", "good");
    THEME_FIELDS.forEach(f => { saved[f.key] = live[f.key]; });
  });
}

async function admDeposits() {
  const d = await api("/admin/deposits");
  const pending = d.deposits.filter(x => x.status === "pending");
  $("#admbody").innerHTML = `
    <p class="note info" style="margin:0 0 16px">Verify each transaction hash on the coin's block explorer before
      approving — confirm the amount landed in your wallet and has enough confirmations. Approving credits the user's
      buyer balance. You can adjust the credited amount to whatever actually arrived.</p>
    <div class="panel"><h3>${pending.length} pending · ${d.deposits.length} total</h3>
    ${d.deposits.length ? `<div class="tablewrap flat"><table>
      <thead><tr><th>Date</th><th>User</th><th>Coin</th><th>Claimed</th><th>Tx hash</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody>${d.deposits.map(x => `<tr>
        <td class="num" style="color:var(--muted)">${fmtDate(x.createdAt)}</td>
        <td class="uid">Seller#${x.uid}<br><span style="font-size:11px">${esc(x.username)}</span></td>
        <td>${esc(x.coin)}</td><td class="num" style="font-weight:700">${money(x.amount)}</td>
        <td class="uid" style="max-width:160px;overflow:hidden;text-overflow:ellipsis" title="${esc(x.txid)}">${esc(x.txid)}</td>
        <td><span class="tag ${x.status === "approved" ? "verified" : x.status === "rejected" ? "proj" : "neutral"}">${x.status}</span></td>
        <td><div class="actions">${x.status === "pending" ? `
          <button class="btn btn-solid btn-sm" data-dapp="${x.id}" data-a="${x.amount}" data-u="${x.uid}">Approve</button>
          <button class="btn btn-out btn-sm" data-drej="${x.id}">Reject</button>` : ""}</div></td>
      </tr>`).join("")}</tbody></table></div>`
      : `<p style="color:var(--muted);font-size:14px">No deposits submitted yet.</p>`}</div>`;

  view.querySelectorAll("[data-dapp]").forEach(b => b.onclick = () => {
    openModal(`<h2>Approve deposit</h2><p class="lede">Credit Seller#${b.dataset.u}'s buyer balance.</p>
      <div class="field"><label for="daAmt">Amount to credit (USD)</label>
        <input id="daAmt" type="number" step="0.01" value="${b.dataset.a}">
        <span class="hint">Defaults to what they claimed — change it to the amount that actually arrived.</span></div>
      <p class="note bad">Only approve after you've confirmed the transaction on-chain. This is real money.</p>
      <div class="modal-actions"><button class="btn btn-out" id="daX">Cancel</button>
        <button class="btn btn-solid" id="daOk">Approve & credit</button></div>`);
    $("#daX").onclick = closeModal;
    $("#daOk").onclick = () => busy($("#daOk"), async () => {
      await api(`/admin/deposits/${b.dataset.dapp}/approve`, { method: "POST", body: { amount: +$("#daAmt").value } });
      closeModal(); toast("Deposit approved and credited.", "good"); admDeposits();
    });
  });
  view.querySelectorAll("[data-drej]").forEach(b => b.onclick = async () => {
    if (!await ask({ title: "Reject this deposit?", danger: true, ok: "Reject",
      body: "<p>Nothing is credited. Do this if the transaction can't be found or the amount doesn't match.</p>" })) return;
    await api(`/admin/deposits/${b.dataset.drej}/reject`, { method: "POST" });
    toast("Deposit rejected."); admDeposits();
  });
}

async function admData() {

/* Animated light/dark switch. Uses the View Transitions API for a circular
   wipe out of the toggle button where supported, and falls back to a global
   colour cross-fade everywhere else. Crucially it does NOT re-render the page —
   only the data-theme attribute flips — so nothing snaps or reflows. */
let themingTimer = null;
function flipTheme() {
  const dark = document.documentElement.dataset.theme === "dark";
  const next = dark ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  localStorage.setItem("theme", next);
  if (SET.brandColor) applyTheme(SET);
  // keep the toggle's own label/icon in sync without a full re-render
  const lbl = document.querySelector("#theme .hide-sm");
  if (lbl) lbl.textContent = next === "dark" ? "Light" : "Dark";
}
function toggleTheme(e) {
  const root = document.documentElement;
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

  if (reduce) { flipTheme(); return; }

  // origin point for the wipe = the toggle button, so it feels like it comes from your click
  const btn = document.getElementById("theme");
  const r = btn ? btn.getBoundingClientRect() : { left: innerWidth / 2, top: 0, width: 0, height: 0 };
  root.style.setProperty("--vt-x", (r.left + r.width / 2) + "px");
  root.style.setProperty("--vt-y", (r.top + r.height / 2) + "px");

  // colour cross-fade path — always on, and the only path without View Transitions
  clearTimeout(themingTimer);
  root.classList.add("theming");
  themingTimer = setTimeout(() => root.classList.remove("theming"), 650);

  if (document.startViewTransition) {
    root.classList.add("vt-theming");
    const t = document.startViewTransition(() => flipTheme());
    t.finished.finally(() => root.classList.remove("vt-theming"));
  } else {
    flipTheme();
  }
}

}
