<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BloxSwap — buy and sell Roblox limiteds</title>
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EFEFEC;--surface:#FFF;--surface-2:#F8F8F6;--sunken:#E7E7E2;
  --ink:#191A18;--ink-2:#4C4E4A;--muted:#83857F;--line:#E1E1DB;--line-2:#C9C9C1;
  --brand:#EA5B0C;--brand-2:#FF7A2E;--brand-deep:#B24309;--brand-soft:#FFEDE1;
  --accent:#EA5B0C;--accent-soft:#FFEDE1;--accent-ink:#B24309;
  --secondary:#3F4652;--secondary-deep:#272C34;
  --feature:#191A18;--feature-ink:#FFFFFF;
  --verified:#1C8C55;--verified-soft:#E4F3EB;--verified-ink:#0F5C36;
  --up:#1C8C55;--up-soft:#E4F3EB;--down:#CF3C57;--down-soft:#FCE9ED;
  --warn:#9A6B12;--warn-soft:#F7EEDC;
  --brand-glow:rgba(234,91,12,.28);
  --r:15px;--ease:cubic-bezier(.22,.61,.36,1);
  --shadow:0 10px 28px rgba(25,26,24,.10);
  --shadow-lg:0 24px 58px rgba(25,26,24,.20);
}
:root[data-theme="dark"]{
  --paper:#0E0F0E;--surface:#17191A;--surface-2:#1D2021;--sunken:#111313;
  --ink:#F1F2F0;--ink-2:#B4B7B2;--muted:#7E827C;--line:#282B2C;--line-2:#3A3E3F;
  --brand:#FF7A2E;--brand-2:#FF9557;--brand-deep:#C2530F;--brand-soft:#2B1810;
  --accent:#FF7A2E;--accent-soft:#2B1810;--accent-ink:#FF9557;
  --secondary:#6B7684;--secondary-deep:#4A525E;
  --feature:#F1F2F0;--feature-ink:#15161A;
  --verified:#3BC183;--verified-soft:#102A1E;--verified-ink:#5FE0A6;
  --up:#3BC183;--up-soft:#102A1E;--down:#F0637F;--down-soft:#2E161C;
  --warn:#D8A24A;--warn-soft:#2A2314;
  --brand-glow:rgba(255,122,46,.32);
  --shadow:0 10px 30px rgba(0,0,0,.5);
  --shadow-lg:0 24px 60px rgba(0,0,0,.68);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;text-align:left}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4{margin:0;letter-spacing:-.025em;font-weight:700}
p{margin:0}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.012em}
[hidden]{display:none!important}

@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes scrimIn{from{opacity:0}to{opacity:1}}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#view>*{animation:fadeUp .32s var(--ease) both}
.stagger>*{animation:fadeUp .36s var(--ease) both}
.stagger>*:nth-child(1){animation-delay:.02s}.stagger>*:nth-child(2){animation-delay:.04s}
.stagger>*:nth-child(3){animation-delay:.06s}.stagger>*:nth-child(4){animation-delay:.08s}
.stagger>*:nth-child(5){animation-delay:.1s}.stagger>*:nth-child(6){animation-delay:.12s}
.stagger>*:nth-child(n+7){animation-delay:.14s}

.bar{font-size:12.5px}
.bar div{max-width:1520px;margin:0 auto;padding:7px 22px;display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap}
.bar.trust{background:var(--ink);color:var(--paper)}
.bar.trust svg{stroke:var(--brand-2)}
.bar.trust span{display:inline-flex;align-items:center;gap:6px;opacity:.95;font-weight:500}
.bar.trust svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bar.admin{background:var(--down);color:#fff;font-weight:600}
.bar.admin button{color:#fff;text-decoration:underline;font-weight:600;font-size:12.5px}
.bar.notice{background:var(--warn-soft);color:var(--warn);font-weight:600;border-bottom:1px solid var(--line)}
.bar.announce-info{background:var(--brand-soft);color:var(--brand-deep);font-weight:600;border-bottom:1px solid var(--line)}
.bar.announce-good{background:var(--up-soft);color:var(--up);font-weight:600;border-bottom:1px solid var(--line)}
.bar.announce-warn{background:var(--warn-soft);color:var(--warn);font-weight:600;border-bottom:1px solid var(--line)}

.top{position:sticky;top:0;z-index:60;background:color-mix(in srgb,var(--surface) 88%,transparent);
  backdrop-filter:saturate(1.6) blur(16px);border-bottom:1px solid var(--line)}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--brand) 38%,transparent),transparent)}
.top-in{height:62px;display:flex;align-items:center;gap:12px;padding:0 22px;max-width:1520px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.04em}
.brand .logo{width:30px;height:30px;flex:none;transition:transform .35s var(--ease)}
.brand:hover .logo{transform:rotate(-10deg) scale(1.08)}
.brand .word .sw{color:var(--brand)}
.gate-logo{width:64px;height:64px;margin:0 auto 20px}
.gate-art{display:flex;justify-content:center;align-items:flex-end;gap:2px;margin:24px 0 4px;min-height:10px}
.gate-art img{height:150px;width:auto;object-fit:contain;filter:drop-shadow(0 10px 20px rgba(25,26,24,.16))}
.gate-art img:nth-child(1){height:118px;opacity:.72;transform:rotate(-6deg) translateX(16px)}
.gate-art img:nth-child(3){height:118px;opacity:.72;transform:rotate(6deg) translateX(-16px)}
@media (max-width:520px){.gate-art img:nth-child(1),.gate-art img:nth-child(3){display:none}}
.gate-logo .logo{width:100%;height:100%}
.spacer{flex:1}
.tools{display:flex;align-items:center;gap:6px}
.btn{height:36px;padding:0 14px;border-radius:11px;display:inline-flex;align-items:center;gap:7px;font-size:14px;
  font-weight:500;color:var(--ink-2);white-space:nowrap;justify-content:center;
  transition:background .16s var(--ease),color .16s,transform .1s,border-color .16s,opacity .16s}
.btn:hover{background:var(--surface);color:var(--ink)}
.btn:active{transform:scale(.97)}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.btn-solid{background:linear-gradient(180deg,var(--brand-2),var(--brand));color:#fff;font-weight:600;
  box-shadow:0 2px 0 var(--brand-deep),0 5px 14px var(--brand-glow,rgba(234,91,12,.26))}
.btn-solid:hover{background:linear-gradient(180deg,var(--brand-2),var(--brand));
  filter:brightness(1.07);color:#fff}
.btn-solid:active{transform:translateY(1px);box-shadow:0 1px 0 var(--brand-deep)}
.btn-out{border:1px solid var(--line-2);background:var(--surface)}
.btn-out:hover{border-color:var(--secondary);color:var(--secondary-deep)}
.btn-danger{background:var(--down);color:#fff;font-weight:600}
.btn-danger:hover{background:var(--down);filter:brightness(1.07);opacity:1;color:#fff}
.btn-sm{height:31px;padding:0 11px;font-size:13px;border-radius:9px}
.btn[disabled]{opacity:.42;pointer-events:none}
.btn .spin{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
select.btn{border:1px solid var(--line);background:var(--surface);appearance:none;padding-right:28px;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 15px) 16px,calc(100% - 10px) 16px;background-size:5px 5px;background-repeat:no-repeat}
.wallet{display:flex;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:11px;overflow:hidden}
.wallet a:first-child b{color:var(--brand-deep)}
:root[data-theme="dark"] .wallet a:first-child b{color:var(--brand-2)}
.wallet a:last-child b{color:var(--secondary)}
.wallet a{background:var(--surface);padding:4px 11px;display:flex;flex-direction:column;line-height:1.15;transition:background .16s}
.wallet a:hover{background:var(--surface-2)}
.wallet small{font-size:10.5px;color:var(--muted)}
.wallet b{font-size:13.5px;font-weight:700;letter-spacing:-.02em}
.pip{background:var(--down);color:#fff;border-radius:99px;padding:0 6px;font-size:11px;font-weight:700;margin-left:6px}

.shell{display:flex;max-width:1520px;margin:0 auto}
.rail{width:224px;flex:none;padding:20px 14px;position:sticky;top:62px;align-self:flex-start;
  height:calc(100vh - 62px);display:flex;flex-direction:column;overflow-y:auto}
.rail nav{display:flex;flex-direction:column;gap:1px}
.rail a{display:flex;align-items:center;gap:11px;height:40px;padding:0 12px;border-radius:11px;color:var(--ink-2);
  font-weight:500;font-size:14.5px;transition:background .16s var(--ease),color .16s,transform .16s}
.rail a:hover{background:var(--surface);color:var(--ink);transform:translateX(2px)}
.rail a.on{background:var(--brand-soft);color:var(--brand-deep);font-weight:700;
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--brand) 28%,transparent)}
:root[data-theme="dark"] .rail a.on{color:var(--brand-2)}
.rail a.on svg{stroke:var(--brand)}
.rail a.danger{color:var(--down)}
.rail svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.main{flex:1;min-width:0;padding:0 22px 90px}

.hero{padding:34px 30px 30px;max-width:none;margin:18px 0 24px;border-radius:20px;position:relative;
  overflow:hidden;background:#191A18;color:#F1F2F0;
  border:1px solid #262724;box-shadow:0 14px 40px rgba(25,26,24,.20)}
.hero::before{content:"";position:absolute;inset:0;
  background:radial-gradient(90% 130% at 12% 0%,var(--brand-glow,rgba(234,91,12,.28)),transparent 58%);pointer-events:none}
.hero-art{position:absolute;right:0;top:0;bottom:0;width:min(46%,470px);display:flex;align-items:center;
  justify-content:flex-end;gap:0;pointer-events:none;padding-right:14px}
.hero-art img{height:88%;width:auto;object-fit:contain;filter:drop-shadow(0 14px 28px rgba(0,0,0,.42))}
.hero-art img:nth-child(1){height:70%;opacity:.55;transform:translateX(46px) rotate(-5deg)}
.hero-art img:nth-child(2){height:78%;opacity:.8;transform:translateX(22px) rotate(3deg)}
.hero-art img:nth-child(3){height:94%;position:relative;z-index:2}
@media (max-width:900px){.hero-art{display:none}}
.hero>*{position:relative;z-index:1}
.hero .sub{color:rgba(241,242,240,.7)!important;max-width:52ch}
.hero .search{max-width:600px;border-color:transparent;box-shadow:0 10px 28px rgba(0,0,0,.28)}
.hero h1 em{font-style:normal;color:var(--brand-2)}
.hero h1{font-size:34px;line-height:1.06;margin-bottom:8px;max-width:20ch}
.hero .sub{color:var(--muted);font-size:16px;margin-bottom:20px;max-width:60ch}
.search{display:flex;align-items:center;gap:11px;height:54px;padding:0 17px;background:var(--surface);
  border:1px solid var(--line-2);border-radius:15px;transition:border-color .18s var(--ease),box-shadow .18s var(--ease)}
.search:focus-within{border-color:var(--brand);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 22%,transparent)}
.search svg{width:19px;height:19px;stroke:var(--muted);fill:none;stroke-width:1.8}
.search input{flex:1;border:0;background:none;outline:none;font-size:16.5px;min-width:0}
.search input::placeholder{color:var(--muted)}
.search kbd{border:1px solid var(--line);border-radius:6px;padding:2px 7px;font-size:12px;color:var(--muted);font-family:inherit}
.hero .count,.hero .lede{color:rgba(255,255,255,.86)}
.hero-badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.hero-badges span{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:99px;
  background:rgba(241,242,240,.07);border:1px solid rgba(241,242,240,.13);font-size:13px;font-weight:500;
  color:rgba(241,242,240,.9)}
.hero-badges svg{stroke:var(--brand-2)}
.hero-badges svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.1;
  stroke-linecap:round;stroke-linejoin:round}

.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-bottom:15px;margin-bottom:18px;border-bottom:1px solid var(--line)}
.count{margin-right:auto;font-size:14px;color:var(--muted)}
.count b{color:var(--ink);font-weight:600}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{height:31px;padding:0 13px;border-radius:9px;font-size:13.5px;font-weight:500;color:var(--muted);
  transition:background .2s var(--ease),color .2s}
.seg button[aria-pressed="true"]{background:linear-gradient(180deg,var(--brand-2),var(--brand));
  color:#fff;font-weight:600;box-shadow:0 2px 7px var(--brand-glow,rgba(234,91,12,.3))}

.grid{display:grid;gap:15px;grid-template-columns:repeat(auto-fill,minmax(212px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  display:flex;flex-direction:column;position:relative;box-shadow:0 1px 2px rgba(25,26,24,.05);
  transition:border-color .2s var(--ease),transform .2s var(--ease),box-shadow .2s var(--ease)}
.card:hover{border-color:color-mix(in srgb,var(--brand) 40%,var(--line));transform:translateY(-4px);
  box-shadow:var(--shadow)}
.card.house{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.pays{position:absolute;left:9px;bottom:9px;display:flex;gap:4px;opacity:.55}
.pays i{width:19px;height:13px;border-radius:3px;background:var(--ink);display:block}
.pays i.c2{background:var(--muted)}.pays i.c3{background:var(--line-2)}
.bell{position:relative}
.bell .cnt{position:absolute;top:-3px;right:-3px;background:var(--down);color:#fff;border-radius:99px;
  min-width:17px;height:17px;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.notif{position:absolute;top:52px;right:16px;width:min(380px,calc(100vw - 24px));background:var(--surface);
  border:1px solid var(--line);border-radius:15px;box-shadow:0 22px 54px rgba(0,0,0,.2);z-index:120;overflow:hidden;
  animation:popIn .22s var(--ease) both}
.notif-h{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.notif-h b{font-size:14.5px}
.notif-l{max-height:min(420px,60vh);overflow-y:auto}
.notif-l a{display:flex;gap:11px;padding:11px 16px;border-bottom:1px solid var(--line);transition:background .15s}
.notif-l a:hover{background:var(--surface-2)}
.nk{width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;font-size:13px;font-weight:700}
.nk.ticket{background:var(--accent-soft);color:var(--accent-ink)}
.nk.payout{background:var(--up-soft);color:var(--up)}
.nk.claim{background:var(--down-soft);color:var(--down)}
.nk.signup{background:var(--sunken);color:var(--ink-2)}
.nk.stuck{background:var(--warn-soft);color:var(--warn)}
.notif b.nt{display:block;font-size:13.5px;font-weight:600;line-height:1.3}
.notif span.nd{font-size:12px;color:var(--muted)}
.notif time{font-size:11.5px;color:var(--muted);margin-left:auto;white-space:nowrap}
.faq{border-top:1px solid var(--line)}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{padding:15px 2px;font-weight:600;font-size:15px;cursor:pointer;list-style:none;
  display:flex;justify-content:space-between;gap:16px;transition:color .15s}
.faq summary:hover{color:var(--accent-ink)}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";color:var(--muted);font-weight:400;font-size:19px;line-height:1}
.faq details[open] summary::after{content:"\2013"}
.faq .ans{padding:0 2px 16px;color:var(--ink-2);font-size:14.5px;max-width:66ch;animation:fadeUp .22s var(--ease) both}
.qcat{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}
.qcat button{padding:7px 13px;border-radius:99px;border:1px solid var(--line);background:var(--surface);
  font-size:13.5px;font-weight:500;color:var(--ink-2);transition:all .16s var(--ease)}
.qcat button[aria-pressed="true"]{background:linear-gradient(180deg,var(--brand-2),var(--brand));
  color:#fff;border-color:transparent}
.lookup{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(168px,1fr))}
.lk{border:1px solid var(--line);border-radius:11px;background:var(--surface);overflow:hidden;
  display:flex;flex-direction:column;transition:border-color .16s,transform .16s}
.lk:hover{border-color:color-mix(in srgb,var(--brand) 40%,var(--line));transform:translateY(-2px);box-shadow:var(--shadow)}
.lk .im{aspect-ratio:1/.85;display:grid;place-items:center;border-bottom:1px solid var(--line);
  background:radial-gradient(120% 100% at 50% 120%,var(--sunken),var(--surface-2) 70%)}
.lk .im img{width:74%;height:74%;object-fit:contain}
.lk .bd{padding:9px 10px 10px;display:flex;flex-direction:column;gap:5px;flex:1}
.lk .nm{font-size:13px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden;min-height:2.4em}
.lk .mt{font-size:11.5px;color:var(--muted)}

/* live raffle strip */
.raffle{display:flex;align-items:center;gap:18px;padding:16px 20px;border-radius:18px;margin-bottom:20px;
  background:var(--surface);border:1px solid var(--line);color:var(--ink);position:relative;overflow:hidden;
  flex-wrap:wrap;box-shadow:var(--shadow)}
.raffle::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(80% 140% at 88% 0%,var(--brand-glow,rgba(234,91,12,.3)),transparent 62%)}
.raffle>*{position:relative;z-index:1}
.raffle .rimg{width:76px;height:76px;flex:none;border-radius:14px;background:var(--sunken);
  display:grid;place-items:center;padding:7px}
.raffle .rimg img{width:100%;height:100%;object-fit:contain}
.raffle .rmain{flex:1;min-width:190px}
.raffle .rlab{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;
  letter-spacing:.04em;text-transform:uppercase;color:var(--brand-deep);margin-bottom:4px}
:root[data-theme="dark"] .raffle .rlab{color:var(--brand-2)}
.raffle .rlab i{width:6px;height:6px;border-radius:50%;background:var(--brand);animation:blip 1.8s ease-in-out infinite}
@keyframes blip{0%,100%{opacity:1}50%{opacity:.25}}
.raffle h3{font-size:19px;margin-bottom:3px}
.raffle .rmeta{font-size:13px;color:var(--muted)}
.raffle .rcta{display:flex;flex-direction:column;gap:7px;align-items:flex-end;min-width:150px}
.rclock{font-variant-numeric:tabular-nums;font-size:15px;font-weight:700;letter-spacing:-.02em}
.rbar{height:5px;border-radius:99px;background:var(--sunken);overflow:hidden;margin-top:9px}
.rbar span{display:block;height:100%;border-radius:99px;background:var(--brand);transition:width .4s var(--ease)}

/* recently sold rail */
.sold-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:4px 0 11px}
.sold-h h2{font-size:16px}
.sold-h span{font-size:13px;color:var(--muted)}
.sold{position:relative;overflow:hidden;padding:2px 0 10px;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent)}
.sold-track{display:flex;gap:10px;width:max-content;animation:soldScroll var(--sold-dur,34s) linear infinite}
.sold:hover .sold-track{animation-play-state:paused}
@keyframes soldScroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes scPop{0%{transform:scale(.82);opacity:0}55%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
@keyframes scRing{0%{box-shadow:0 0 0 0 var(--brand-glow,rgba(234,91,12,.5))}100%{box-shadow:0 0 0 14px transparent}}
.sc-new{animation:scPop .5s var(--ease) both, scRing .9s ease-out .1s both}
.sc-new .sp{color:var(--brand-deep)}
.sc{flex:none;width:158px;background:var(--surface);border:1px solid var(--line);
  border-radius:13px;overflow:hidden;transition:border-color .18s var(--ease),transform .18s}
.sc:hover{border-color:var(--line-2);transform:translateY(-2px)}
.sc .si{height:82px;display:grid;place-items:center;border-bottom:1px solid var(--line);
  background:radial-gradient(120% 100% at 50% 120%,var(--sunken),var(--surface-2) 70%)}
.sc .si img{width:64%;height:64%;object-fit:contain}
.sc .sb{padding:9px 10px}
.sc .sn{font-size:12.5px;font-weight:600;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc .sp{font-size:14px;font-weight:800;color:var(--brand-deep);letter-spacing:-.03em}
:root[data-theme="dark"] .sc .sp{color:var(--brand-2)}
.sc .st{font-size:11px;color:var(--muted)}

/* browse chips */
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
.chips button{padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);
  font-size:13.5px;font-weight:600;color:var(--ink-2);transition:all .16s var(--ease)}
.chips button:hover{border-color:var(--line-2);transform:translateY(-1px)}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* colour picker */
.swatches{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}
.swatches button{width:38px;height:38px;border-radius:11px;border:2px solid transparent;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);transition:transform .15s var(--ease)}
.swatches button:hover{transform:scale(1.1)}
.swatches button[aria-pressed="true"]{border-color:var(--ink);transform:scale(1.06)}
.picker{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.picker input[type=color]{width:64px;height:64px;padding:0;border:1px solid var(--line-2);
  border-radius:14px;background:none;cursor:pointer}
.picker input[type=color]::-webkit-color-swatch-wrapper{padding:5px}
.picker input[type=color]::-webkit-color-swatch{border:none;border-radius:9px}
.ramp{display:flex;gap:0;border-radius:11px;overflow:hidden;border:1px solid var(--line)}
.ramp i{width:46px;height:38px;display:block}
.ramp i span{display:none}

.recv{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden;margin-bottom:10px}
.recv-row{display:flex;align-items:center;gap:12px;padding:11px 13px;border-bottom:1px solid var(--line);
  transition:background .15s var(--ease)}
.recv-row:last-child{border-bottom:0}
.recv-row img{width:36px;height:36px;border-radius:9px;background:var(--sunken);object-fit:cover;flex:none}
.recv-row .rn{flex:1;min-width:0}
.recv-row .rn b{display:block;font-size:14px}
.recv-row .rn span{font-size:12px;color:var(--muted)}
.recv-pick{border:1px solid var(--line-2);border-radius:11px;background:var(--surface);cursor:pointer;
  display:flex;align-items:center;gap:12px;padding:11px 13px;width:100%;margin-bottom:8px;
  transition:border-color .16s var(--ease),background .16s}
.recv-pick:hover{border-color:var(--secondary)}
.recv-pick[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.recv-pick img{width:38px;height:38px;border-radius:10px;background:var(--sunken);object-fit:cover;flex:none}
.recv-pick .rn{flex:1;min-width:0;text-align:left}
.recv-pick .rn b{display:block;font-size:14px}
.recv-pick .rn span{font-size:12px;color:var(--muted)}
.recv-pick .rcheck{width:19px;height:19px;border-radius:50%;border:2px solid var(--line-2);flex:none;
  display:grid;place-items:center}
.recv-pick[aria-pressed="true"] .rcheck{border-color:var(--brand);background:var(--brand)}
.recv-pick[aria-pressed="true"] .rcheck::after{content:"";width:7px;height:7px;border-radius:50%;background:#fff}

.pm-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px}
.pm-tile{border:1px solid var(--line-2);border-radius:11px;background:var(--surface);padding:13px 12px;
  display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;
  transition:border-color .16s var(--ease),background .16s,transform .1s}
.pm-tile:hover{border-color:var(--secondary)}
.pm-tile:active{transform:scale(.97)}
.pm-tile[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.pm-tile svg{width:22px;height:22px;stroke:var(--ink-2);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.pm-tile[aria-pressed="true"] svg{stroke:var(--brand-deep)}
.pm-tile b{font-size:13.5px}

.pm-check{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--line-2);border-radius:10px;
  cursor:pointer;transition:border-color .16s var(--ease),background .16s}
.pm-check:hover{border-color:var(--secondary)}
.pm-check[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.pm-check svg{width:17px;height:17px;stroke:var(--ink-2);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pm-check[aria-pressed="true"] svg{stroke:var(--brand-deep)}
.pm-check b{font-size:13.5px}

.buy-steps{display:flex;align-items:center;gap:6px;margin-bottom:16px}
.buy-steps span{flex:1;height:4px;border-radius:99px;background:var(--sunken)}
.buy-steps span.on{background:var(--brand)}
:root[data-theme="dark"] .card:hover{box-shadow:0 10px 26px rgba(0,0,0,.4)}
.thumb{aspect-ratio:1/.86;position:relative;display:grid;place-items:center;
  background:radial-gradient(120% 100% at 50% 120%,var(--sunken),var(--surface-2) 70%);
  border-bottom:1px solid var(--line);overflow:hidden}
.thumb img{width:76%;height:76%;object-fit:contain;transition:transform .35s var(--ease)}
.card:hover .thumb img{transform:scale(1.05)}
.tags{position:absolute;left:9px;top:9px;display:flex;gap:5px;flex-wrap:wrap;max-width:82%}
.tag{font-size:11px;font-weight:600;padding:3px 7px;border-radius:6px;display:inline-flex;align-items:center;gap:4px}
.tag.proj{background:var(--down-soft);color:var(--down)}
.tag.ok{background:var(--up-soft);color:var(--up)}
.tag.neutral{background:var(--sunken);color:var(--muted)}
.tag.star{background:var(--feature);color:var(--feature-ink);box-shadow:0 1px 3px rgba(25,26,24,.3)}
.tag.verified{background:var(--verified-soft);color:var(--verified-ink)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.body{padding:11px 12px 12px;display:flex;flex-direction:column;gap:7px;flex:1}
.name{font-weight:600;font-size:14.5px;line-height:1.28;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden;min-height:2.56em}
.seller{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.seller b{color:var(--ink-2);font-weight:600}
.stats{display:flex;gap:15px;font-size:12px;color:var(--muted)}
.stats span{display:flex;flex-direction:column;gap:1px}
.stats b{font-size:13px;font-weight:600;color:var(--ink-2)}
.buyrow{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;
  border-top:1px solid var(--line);padding-top:10px}
.usd{font-size:19px;font-weight:800;letter-spacing:-.04em;color:var(--brand-deep)}
:root[data-theme="dark"] .usd{color:var(--brand-2)}

.crumbs{display:flex;align-items:center;gap:7px;font-size:13.5px;color:var(--muted);padding:22px 0 16px}
.crumbs a:hover{color:var(--ink)}
.item{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:22px;align-items:start}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:26px;
  display:grid;place-items:center;aspect-ratio:1/.72}
.stage img{width:66%;height:66%;object-fit:contain}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;
  box-shadow:0 1px 2px rgba(25,26,24,.05)}
.panel+.panel{margin-top:14px}
.panel h3{font-size:14.5px;margin-bottom:12px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.panel-head h3{margin:0}
.figrow{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);
  border-radius:11px;overflow:hidden;margin-bottom:16px}
.fig{background:var(--surface);padding:11px 13px}
.fig dt{font-size:12px;color:var(--muted);margin-bottom:2px}
.fig dd{margin:0;font-size:17px;font-weight:700;letter-spacing:-.03em}
.price-big{font-size:34px;font-weight:800;letter-spacing:-.045em;line-height:1;color:var(--brand-deep)}
:root[data-theme="dark"] .price-big{color:var(--brand-2)}
.cta{width:100%;height:48px;border-radius:13px;background:linear-gradient(180deg,var(--brand-2),var(--brand));
  color:#fff;font-weight:700;font-size:15.5px;display:grid;place-items:center;margin-top:14px;
  box-shadow:0 3px 0 var(--brand-deep),0 9px 20px var(--brand-glow,rgba(234,91,12,.28));
  transition:filter .18s var(--ease),transform .1s,box-shadow .1s}
.cta:hover{filter:brightness(1.06)}
.cta:active{transform:translateY(2px);box-shadow:0 1px 0 var(--brand-deep)}
.cta.ghost{background:none;color:var(--ink);border:1px solid var(--line-2);margin-top:8px}
.cta[disabled]{opacity:.4;pointer-events:none}
.escrow{margin:0;padding:0}
.escrow li{display:flex;gap:10px;font-size:13.5px;color:var(--ink-2);list-style:none;margin-bottom:9px}
.escrow svg{width:16px;height:16px;flex:none;margin-top:2px;stroke:var(--up);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.note{font-size:12.5px;background:var(--warn-soft);color:var(--warn);padding:9px 11px;border-radius:9px;margin-top:11px}
.note.info{background:var(--brand-soft);color:var(--brand-deep)}
:root[data-theme="dark"] .note.info{color:var(--brand-2)}
.note.bad{background:var(--down-soft);color:var(--down)}
.note.good{background:var(--up-soft);color:var(--up)}

.field{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
.field label{font-size:13px;font-weight:600}
.field .hint{font-size:12.5px;color:var(--muted)}
.field input,.field select,.field textarea{height:42px;padding:0 13px;border:1px solid var(--line-2);border-radius:10px;
  background:var(--surface);outline:none;width:100%;transition:border-color .16s var(--ease),box-shadow .16s var(--ease)}
.field textarea{height:auto;padding:11px 13px;resize:vertical;min-height:96px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 20%,transparent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.auth{max-width:404px;margin:56px auto 0}
.btn-me{gap:8px;padding-left:6px}
.ipbox{border:1px solid var(--line);border-radius:12px;background:var(--surface-2);padding:14px;margin-bottom:14px}
.ipbox h4{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px;display:flex;align-items:center;gap:7px}
.ipbox h4 svg{width:14px;height:14px;stroke:var(--muted);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ip-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px}
.ip-row:first-of-type{border-top:0}
.ip-val{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;cursor:pointer;position:relative;
  padding:2px 8px;border-radius:7px;background:var(--sunken);transition:filter .18s var(--ease),background .18s}
.ip-val.blurred{filter:blur(5px);user-select:none}
.ip-val.blurred::after{content:"tap to reveal";position:absolute;inset:0;display:grid;place-items:center;
  filter:blur(0);font-family:var(--sans,inherit);font-size:10.5px;color:var(--ink-2);white-space:nowrap;pointer-events:none}
.ip-val:not(.blurred){background:var(--brand-soft);color:var(--brand-deep)}
.ip-when{font-size:12px;color:var(--muted)}
.dep-coins{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;margin-bottom:16px}
.dep-coin{border:1px solid var(--line-2);border-radius:12px;background:var(--surface);padding:13px;cursor:pointer;
  transition:border-color .16s var(--ease),background .16s,transform .1s;text-align:left}
.dep-coin:hover{border-color:var(--secondary)}
.dep-coin:active{transform:scale(.98)}
.dep-coin[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.dep-coin b{display:block;font-size:14px}
.dep-coin span{font-size:12px;color:var(--muted)}
.dep-addr{display:flex;align-items:center;gap:10px;background:var(--sunken);border:1px dashed var(--line-2);
  border-radius:11px;padding:13px 15px;margin-bottom:14px;flex-wrap:wrap}
.dep-addr code{font-family:ui-monospace,Menlo,monospace;font-size:13px;flex:1;min-width:180px;word-break:break-all}
.dep-status{font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px}
.me-av{width:22px;height:22px;border-radius:7px;background:var(--sunken) center/cover no-repeat;flex:none;
  box-shadow:inset 0 0 0 1px var(--line)}
.auth .panel{position:relative;overflow:hidden}
.auth .panel::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;
  background:linear-gradient(90deg,var(--brand),var(--brand-2))}
.auth-secure{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:18px;
  font-size:12.5px;color:var(--muted)}
.auth-secure svg{width:14px;height:14px;stroke:var(--verified);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.auth .panel{padding:24px}
.auth h1{font-size:24px;margin-bottom:5px}
.auth .lede{color:var(--muted);font-size:14.5px;margin-bottom:20px}
.auth-alt{text-align:center;color:var(--muted);font-size:14px;margin-top:14px}
.auth-alt a{color:var(--brand-deep);font-weight:600}
:root[data-theme="dark"] .auth-alt a{color:var(--brand-2)}
.gate{max-width:460px;margin:60px auto;text-align:center}

.gate h1{font-size:27px;margin-bottom:8px}
.gate p{color:var(--muted);margin-bottom:22px}
.gate .actions{display:flex;gap:9px;justify-content:center}
.gate .actions .btn{height:44px;padding:0 22px}

.tabs{display:flex;gap:3px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:11px 13px;font-size:14px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;
  margin-bottom:-1px;white-space:nowrap;transition:color .18s var(--ease),border-color .18s var(--ease)}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--brand-deep);font-weight:700;border-bottom-color:var(--brand)}
:root[data-theme="dark"] .tabs button[aria-selected="true"]{color:var(--brand-2)}
.balgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:18px}
.balcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:17px;
  position:relative;overflow:hidden;box-shadow:0 1px 2px rgba(25,26,24,.05);transition:transform .2s var(--ease),box-shadow .2s}
.balcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
  background:linear-gradient(180deg,var(--brand-2),var(--brand))}
.balcard:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.balcard dd{color:var(--ink)}
.balcard dt{font-size:12.5px;color:var(--muted);margin-bottom:4px}
.balcard dd{margin:0;font-size:27px;font-weight:700;letter-spacing:-.04em}
.balcard .sub{font-size:12.5px;color:var(--muted);margin-top:5px}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:0 10px 9px;white-space:nowrap}
td{padding:10px;border-top:1px solid var(--line);vertical-align:middle}
tbody tr{transition:background .14s var(--ease)}
tbody tr:hover{background:var(--surface-2)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px}
.tablewrap.flat{border:0;padding:0;background:none}
.uid{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;color:var(--ink-2)}
.actions{display:flex;gap:5px;flex-wrap:wrap}

.vstep{display:flex;gap:14px;padding:16px 0;border-top:1px solid var(--line)}
.vstep:first-of-type{border-top:0;padding-top:0}
.vnum{flex:none;width:28px;height:28px;border-radius:9px;background:var(--sunken);display:grid;place-items:center;
  font-size:13px;font-weight:700;color:var(--ink-2)}
.vnum.done{background:var(--up);color:#fff}
.vbody{flex:1;min-width:0}
.vbody h4{font-size:14.5px;margin-bottom:4px}
.vbody p{color:var(--muted);font-size:13.5px;margin-bottom:10px}
.phrase{display:flex;align-items:center;gap:10px;background:var(--sunken);border:1px dashed var(--line-2);
  border-radius:11px;padding:15px 16px;margin-bottom:10px;flex-wrap:wrap}
.phrase code{font-family:inherit;font-size:18px;font-weight:700;flex:1;min-width:210px;letter-spacing:-.01em}
.rbxuser{display:flex;align-items:center;gap:11px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:11px;padding:11px 13px}
.rbxuser img{width:46px;height:46px;border-radius:10px;background:var(--sunken);object-fit:cover}
.rbxuser b{display:block;font-size:15px}
.rbxuser span{font-size:12.5px;color:var(--muted)}

.inv{display:grid;gap:13px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.invcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  display:flex;flex-direction:column;transition:transform .2s var(--ease),border-color .2s}
.invcard:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--brand) 40%,var(--line));box-shadow:var(--shadow)}
.invcard .thumb{aspect-ratio:1/.82}
.invcard{box-shadow:0 1px 2px rgba(25,26,24,.05)}
.invcard .body{padding:10px 11px 11px;gap:6px}
.invcard .nm{font-weight:600;font-size:13.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden;min-height:2.4em}
.invcard .meta{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}

.methods{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px;margin-bottom:14px}
.method{border:1px solid var(--line-2);border-radius:11px;padding:12px;background:var(--surface);display:flex;
  flex-direction:column;gap:3px;transition:border-color .16s var(--ease),background .16s,transform .1s}
.method:hover{border-color:var(--ink)}
.method:active{transform:scale(.985)}
.method[aria-pressed="true"]{border-color:var(--ink);background:var(--sunken);box-shadow:inset 0 0 0 1px var(--ink)}
.method b{font-size:14px}
.method span{font-size:12px;color:var(--muted)}

.ticket{display:block;width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);
  background:var(--surface);margin-bottom:9px;transition:border-color .16s var(--ease),transform .16s}
.ticket:hover{border-color:var(--line-2);transform:translateY(-1px)}
.ticket .tk-top{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:3px}
.ticket b{font-size:14.5px}
.ticket .tk-last{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat{display:flex;flex-direction:column;height:min(62vh,540px);border:1px solid var(--line);border-radius:var(--r);
  background:var(--surface);overflow:hidden}
.chat-head{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chat-log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:78%;padding:10px 13px;border-radius:14px;font-size:14.5px;line-height:1.4;
  animation:msgIn .24s var(--ease) both;white-space:pre-wrap;word-break:break-word}
.msg.them{background:var(--sunken);border-bottom-left-radius:5px;align-self:flex-start}
.msg.mine{background:linear-gradient(180deg,var(--brand-2),var(--brand));color:#fff;
  border-bottom-right-radius:5px;align-self:flex-end}
.msg time{display:block;font-size:11px;opacity:.6;margin-top:4px}
.chat-form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}

.skeleton::after{content:"";position:absolute;inset:0;

.scrim{position:fixed;inset:0;background:rgba(14,15,14,.58);backdrop-filter:blur(4px);z-index:200;display:grid;
  place-items:center;padding:20px;animation:scrimIn .18s var(--ease) both}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;width:100%;max-width:440px;

  gap:8px;align-items:center;pointer-events:none}

  box-shadow:var(--shadow-lg);max-width:90vw;animation:toastIn .26s var(--ease) both;transition:opacity .3s,transform .3s}

footer{border-top:1px solid var(--line);background:var(--surface);margin-top:40px;position:relative}

}
/* Smooth theme switch: while .theming is on the root, every element eases its
   colours instead of hard-cutting. Kept off the rest of the time so normal
   interactions stay snappy. */
html.theming, html.theming *, html.theming *::before, html.theming *::after{
  transition:background-color .5s var(--ease), color .5s var(--ease),
    border-color .5s var(--ease), fill .5s var(--ease), stroke .5s var(--ease),
    box-shadow .5s var(--ease), opacity .5s var(--ease) !important;
}
/* The circular wipe (Chrome/Edge/newer browsers). The new theme is painted on
   top and revealed with an expanding clip-circle from the toggle button. */
::view-transition-old(root),
::view-transition-new(root){ animation:none; mix-blend-mode:normal; }
::view-transition-old(root){ z-index:1; }
::view-transition-new(root){ z-index:2; }
html.vt-theming::view-transition-new(root){ animation:vtWipe .6s var(--ease) both; }
@keyframes vtWipe{ from{ clip-path:circle(0% at var(--vt-x,50%) var(--vt-y,50%)); }
  to{ clip-path:circle(150% at var(--vt-x,50%) var(--vt-y,50%)); } }
/* Little press-spin on the toggle icon itself. */
#theme svg{ transition:transform .6s var(--ease); }
html.theming #theme svg{ transform:rotate(360deg) scale(1.1); }
/* --- site-wide micro-animation polish --- */
@keyframes riseIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.grid > .card{animation:riseIn .45s var(--ease) both}
.grid > .card:nth-child(1){animation-delay:.02s}.grid > .card:nth-child(2){animation-delay:.05s}

.grid > .card:nth-child(5){animation-delay:.14s}.grid > .card:nth-child(6){animation-delay:.17s}
.grid > .card:nth-child(n+7){animation-delay:.2s}
.btn:not(.btn-solid):active,.pm-tile:active,.method:active,.recv-pick:active,.swatches button:active{transform:scale(.96)}
.balcard,.mini,.panel{will-change:transform}
.tag{transition:transform .15s var(--ease)}
.card:hover .tag.star,.card:hover .tag.verified{transform:translateY(-1px)}
a.rail-link,.tabs button{position:relative}
@keyframes pulseDot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.35)}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

<script>
/* ===================== API ===================== */
async function api(path, opts = {}) {
  const res = await fetch("/api" + path, {
    credentials: "same-origin", headers: { "Content-Type": "application/json" },
    ...opts, body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  let data = {};
  try { data = await res.json(); } catch {}
  if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
  return data;
}
let ME = null, ADMIN = false, SET = {}, UNREAD = 0, STAFF_UNREAD = 0, STAFF = null;

const $ = s => document.querySelector(s);
const view = $("#view");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const money = v => "$" + (Math.round((v || 0) * 100) / 100).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const rbx = n => (n == null || n < 0) ? "—" : n >= 1e6 ? (n / 1e6).toFixed(2).replace(/\.?0+$/, "") + "M" : n >= 1e3 ? Math.round(n / 1e3) + "K" : String(n);
const fmtDate = t => t ? new Date(t).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" }) : "—";
const fmtTime = t => new Date(t).toLocaleString(undefined, { hour: "numeric", minute: "2-digit", month: "short", day: "numeric" });
const assetImg = id => `/api/thumb/asset/${id}`;
const userImg = id => `/api/thumb/user/${id}`;
const PH = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.1" style="width:56%;opacity:.22"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="m4 16 5-5 4 4 3-3 4 4"/></svg>`;
window.PH = PH;
const DEMAND = { "-1": "—", 0: "Terrible", 1: "Low", 2: "Normal", 3: "High", 4: "Amazing" };
const PAY_ICON = {
  "Crypto": '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 8h5a2.5 2.5 0 0 1 0 5H9m0 0h5.5a2.5 2.5 0 0 1 0 5H9m0-10V6m0 12v-2m3-10V6m0 12v-2"/></svg>',
  "PayPal": '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 16V8h3.5a2.5 2.5 0 0 1 0 5H9"/></svg>',
  "Cash App": '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 15.5c.5.8 1.3 1.2 2.5 1.2 1.6 0 2.7-.7 2.7-1.9 0-2.6-5.4-1-5.4-3.6 0-1.2 1.1-1.9 2.7-1.9 1.2 0 2 .4 2.5 1.2M12 6.5v11"/></svg>',
  "Credit card": '<svg viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 10h19"/></svg>'
};
const PAYMENT_METHODS = ["Crypto", "PayPal", "Cash App", "Credit card"];
const verifiedBadge = `<span class="tag verified"><svg viewBox="0 0 24 24"><path d="m5 13 4 4L19 7"/></svg>Verified Seller</span>`;

/* Four hexes from the database drive every coloured surface. */
function hexToRgb(h) {
  const m = /^#?([0-9a-f]{6})$/i.exec(h || ""); if (!m) return null;
  const n = parseInt(m[1], 16);
  return { r: n >> 16 & 255, g: n >> 8 & 255, b: n & 255 };
}
const toHex = ({ r, g, b }) => "#" + [r, g, b].map(v =>
  Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, "0")).join("");
const mix = (c, t, amt) => ({ r: c.r + (t.r - c.r) * amt, g: c.g + (t.g - c.g) * amt, b: c.b + (t.b - c.b) * amt });
const WHITE = { r: 255, g: 255, b: 255 }, BLACK = { r: 0, g: 0, b: 0 };
/* Small chips (Featured, Verified) can end up with a light custom colour behind
   them — pick readable text automatically rather than assuming white works. */
function readableOn(c) {
  const lum = .299 * c.r + .587 * c.g + .114 * c.b;
  return lum > 150 ? "#15161A" : "#FFFFFF";
}
function applyTheme(t) {
  const root = document.documentElement.style;
  const dark = document.documentElement.dataset.theme === "dark";
  const surface = dark ? { r: 20, g: 21, b: 20 } : WHITE;

  const brand = hexToRgb(t.brandColor);
  if (brand) {
    root.setProperty("--brand", t.brandColor);
    root.setProperty("--brand-2", toHex(mix(brand, WHITE, .22)));
    root.setProperty("--brand-deep", toHex(mix(brand, BLACK, .28)));
    root.setProperty("--brand-soft", toHex(mix(brand, surface, dark ? .86 : .89)));
    root.setProperty("--accent", t.brandColor);
    root.setProperty("--accent-soft", toHex(mix(brand, surface, dark ? .86 : .89)));
    root.setProperty("--accent-ink", toHex(mix(brand, BLACK, dark ? -.2 : .3)));
    const g = `${Math.round(brand.r)},${Math.round(brand.g)},${Math.round(brand.b)}`;
    root.setProperty("--brand-glow", `rgba(${g},.28)`);
  }
  const sec = hexToRgb(t.secondaryColor);
  if (sec) {
    root.setProperty("--secondary", t.secondaryColor);
    root.setProperty("--secondary-deep", toHex(mix(sec, BLACK, .22)));
  }
  const feat = hexToRgb(t.featuredColor);
  if (feat) {
    root.setProperty("--feature", t.featuredColor);
    root.setProperty("--feature-ink", readableOn(feat));
  }
  const ver = hexToRgb(t.verifiedColor);
  if (ver) {
    root.setProperty("--verified", t.verifiedColor);
    root.setProperty("--verified-soft", toHex(mix(ver, surface, dark ? .82 : .87)));
    root.setProperty("--verified-ink", toHex(mix(ver, BLACK, dark ? -.15 : .25)));
  }
}
/* Kept as a thin wrapper — a few call sites only ever touch the primary colour. */
function applyBrand(hex) { applyTheme({ brandColor: hex, secondaryColor: SET.secondaryColor,
  featuredColor: SET.featuredColor, verifiedColor: SET.verifiedColor }); }

/* Every visitor — logged in or not — polls the public, unauthenticated colour
   endpoint so a staff change goes live for everyone without a page refresh. */
let themeTimer = null;
function startThemeSync() {
  clearInterval(themeTimer);
  themeTimer = setInterval(async () => {
    try {
      const t = await api("/theme");
      const changed = t.brandColor !== SET.brandColor || t.secondaryColor !== SET.secondaryColor
        || t.featuredColor !== SET.featuredColor || t.verifiedColor !== SET.verifiedColor;
      SET.brandColor = t.brandColor; SET.secondaryColor = t.secondaryColor;
      SET.featuredColor = t.featuredColor; SET.verifiedColor = t.verifiedColor;
      SET.siteNotice = t.siteNotice; SET.maintenance = t.maintenance; SET.announce = t.announce;
      if (changed) applyTheme(t);
      paintChrome(currentPage());
      const nb = $("#noticebar"); if (nb) { nb.hidden = !t.siteNotice; $("#noticeText").textContent = t.siteNotice || ""; }
    } catch {}
  }, 20000);
}

function toast(msg, kind) {
  const t = document.createElement("div");
  t.className = "toast" + (kind ? " " + kind : ""); t.textContent = msg;
  $("#toasts").append(t);
  setTimeout(() => { t.style.opacity = "0"; t.style.transform = "translateY(8px)"; }, 2700);
  setTimeout(() => t.remove(), 3100);
}

function openModal(html, wide) {
  $("#modalRoot").innerHTML = `<div class="scrim" id="scrim"><div class="modal${wide ? " wide" : ""}" role="dialog" aria-modal="true">${html}</div></div>`;
  $("#scrim").onclick = e => { if (e.target.id === "scrim") closeModal(); };
  document.addEventListener("keydown", escClose);
}
function closeModal() { $("#modalRoot").innerHTML = ""; document.removeEventListener("keydown", escClose); }
function escClose(e) { if (e.key === "Escape") closeModal(); }
function ask({ title, body = "", ok = "Confirm", cancel = "Cancel", danger = false, type = null }) {
  return new Promise(res => {
    openModal(`<h2>${esc(title)}</h2><div class="lede">${body}</div>
      ${type ? `<div class="field"><label for="askType">Type <b>${esc(type)}</b> to confirm</label>
        <input id="askType" autocomplete="off" placeholder="${esc(type)}"></div>` : ""}
      <div class="modal-actions"><button class="btn btn-out" id="askNo">${esc(cancel)}</button>
        <button class="btn ${danger ? "btn-danger" : "btn-solid"}" id="askYes">${esc(ok)}</button></div>`);
    $("#askNo").onclick = () => { closeModal(); res(false); };
    $("#askYes").onclick = () => {
      if (type && $("#askType").value.trim() !== type) return toast("That didn't match.", "bad");
      closeModal(); res(true);
    };
    if (type) $("#askType").focus();
  });
}
async function busy(btn, fn) {
  if (!btn) return fn();
  const old = btn.innerHTML; btn.disabled = true;
  btn.innerHTML = `<span class="spin"></span> Working…`;
  try { await fn(); } catch (e) { toast(e.message, "bad"); }
  if (document.body.contains(btn)) { btn.disabled = false; btn.innerHTML = old; }
}
async function refreshMe() {
  const d = await api("/bootstrap");
  ME = d.user; ADMIN = d.admin; SET = d.settings; UNREAD = d.unread || 0;
  STAFF = d.staff || null; STAFF_UNREAD = STAFF ? STAFF.tickets : 0;
  if (SET.brandColor) applyTheme(SET);
}

/* ===================== Auth gate ===================== */
function pageGate() { location.hash = "#/login"; }
function pageLogin() {
  view.innerHTML = `<div class="auth"><div class="panel">
    <h1>Log in</h1><p class="lede">Welcome back to BloxSwap.</p>
    <div class="field"><label for="li">Username, email or user ID</label><input id="li" autocomplete="username"></div>
    <div class="field"><label for="lp">Password</label><input id="lp" type="password" autocomplete="current-password"></div>
    <button class="cta" id="lgo">Log in</button>
    <p class="auth-alt">No account? <a href="#/signup">Sign up</a></p>
    <div class="auth-secure"><svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg> Secured with encrypted sessions</div>
  </div></div>`;
  const go = () => busy($("#lgo"), async () => {
    await api("/login", { method: "POST", body: { id: $("#li").value, password: $("#lp").value } });
    await refreshMe(); toast("Logged in as " + ME.username, "good"); location.hash = "#/limiteds"; render();
  });
  $("#lgo").onclick = go;
  $("#lp").onkeydown = e => { if (e.key === "Enter") go(); };
  $("#li").focus();
}
function pageSignup() {
  view.innerHTML = `<div class="auth"><div class="panel">
    <h1>Create your account</h1><p class="lede">You'll get a permanent ID like Seller#482910.</p>
    <div class="field"><label for="su">Username</label><input id="su" autocomplete="username">
      <span class="hint">Letters, numbers and underscores.</span></div>
    <div class="field"><label for="se">Email</label><input id="se" type="email" autocomplete="email"></div>
    <div class="field"><label for="sp">Password</label><input id="sp" type="password" autocomplete="new-password">
      <span class="hint">At least 8 characters.</span></div>
    <button class="cta" id="sgo">Create account</button>
    <p class="auth-alt">Already have one? <a href="#/login">Log in</a></p>
    <div class="auth-secure"><svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg> Secured with encrypted sessions</div>
  </div></div>`;
  const go = () => busy($("#sgo"), async () => {
    await api("/signup", { method: "POST", body: { username: $("#su").value, email: $("#se").value, password: $("#sp").value } });
    await refreshMe(); toast("Welcome — you are Seller#" + ME.uid, "good"); location.hash = "#/account/roblox"; render();
  });
  $("#sgo").onclick = go;
  $("#sp").onkeydown = e => { if (e.key === "Enter") go(); };
  $("#su").focus();
}

/* ===================== Catalog ===================== */
const state = { q: "", sort: "price-desc", filter: "all", listings: [] };
const ADMIN_TRIGGER = "adminlogin2433:memempxoty";

async function pageCatalog(keepFocus) {
  view.innerHTML = `<section class="hero">
      <div class="hero-art">${[1, 2, 3].map(n =>
        `<img src="/renders/render${n}.png" alt="" loading="lazy" onerror="this.remove()">`).join("")}</div>
      <h1>Roblox limiteds, <em>bought and sold safely</em></h1>
      <p class="sub">Sellers prove they own their Roblox account before listing, and every item is covered by a
        ${SET.warrantyHours}-hour warranty. Your payment stays in escrow until the trade lands.</p>
      <label class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6" stroke-linecap="round"/></svg>
        <input id="q" type="search" placeholder="Search limiteds by name" value="${esc(state.q)}" autocomplete="off">
        <kbd>/</kbd></label>
      <div class="hero-badges">
        <span><svg viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 5 3.4 8.4 8 9 4.6-.6 8-4 8-9V6Z"/><path d="m9 12 2 2 4-4"/></svg> Escrow protected</span>
        <span><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg> ${SET.warrantyHours}h warranty</span>
        <span><svg viewBox="0 0 24 24"><path d="m5 13 4 4L19 7"/></svg> Roblox-verified sellers</span>
      </div>
    </section>
    <div id="raffleStrip"></div>

        <option value="price-asc"${state.sort === "price-asc" ? " selected" : ""}>Price: low to high</option>

      </select>

function paintCatalog() {
  const q = state.q.trim().toLowerCase().replace("seller#", "");
  let ls = state.listings.filter(l => !q || l.name.toLowerCase().includes(q));
  if (state.filter === "verified") ls = ls.filter(l => l.seller.verified);
  if (state.filter === "under50") ls = ls.filter(l => l.price <= 50);
  ls.sort((a, b) => (b.featured - a.featured) ||
    (state.sort === "price-asc" ? a.price - b.price : state.sort === "price-desc" ? b.price - a.price : b.createdAt - a.createdAt));
  $("#cnt").innerHTML = `<b class="num">${ls.length}</b> listing${ls.length === 1 ? "" : "s"}`;
  $("#catBody").innerHTML = ls.length
    ? `<div class="grid stagger">${ls.map(listingCard).join("")}</div>`
    : `<div class="empty"><h3>${state.q ? "Nothing matches that search" : "No listings yet"}</h3>
        <p>${state.q ? "Try a shorter search." : "Verify your Roblox account and be the first to list something."}</p>
        <a class="btn btn-solid" href="#/sell">List an item</a></div>`;
  wireBuys();
}
function wireBuys() {
  view.querySelectorAll("[data-buy]").forEach(b => b.onclick = () => {
    const l = state.listings.find(x => x.id === b.dataset.buy);
    if (!l) return toast("That listing is gone.", "bad");
    openBuyModal(l);
  });
}

/* Three steps: which Roblox account receives it, which payment method the seller
   takes for this listing, then a final confirm. All in one modal so it reads as
   one flow rather than three separate dialogs. */
function openBuyModal(l) {
  const state2 = { recv: null, method: null };

  const stepDots = active => `<div class="buy-steps">
    <span class="${active >= 1 ? "on" : ""}"></span><span class="${active >= 2 ? "on" : ""}"></span>
    <span class="${active >= 3 ? "on" : ""}"></span></div>`;

  function renderStep1() {
    const accts = ME.receivingAccounts || [];
    openModal(`<h2>Where should it go?</h2>
      <p class="lede">${esc(l.name)} — pick the Roblox account to receive it.</p>
      ${stepDots(1)}
      <div id="recvPicks">${accts.length ? accts.map(a => `<button class="recv-pick" data-r="${a.id}" data-n="${esc(a.name)}">
          <img src="${userImg(a.id)}" alt="" onerror="this.style.visibility='hidden'">
          <span class="rn"><b>${esc(a.name)}</b><span>Roblox user ID ${a.id}</span></span>
          <span class="rcheck"></span></button>`).join("")
        : `<p class="note" style="margin:0 0 14px">You haven't saved a Roblox account to receive items on yet.</p>`}</div>
      <div class="field" style="margin-top:${accts.length ? "14px" : "0"}">
        <label for="qAddU">${accts.length ? "Add another account" : "Add a Roblox username"}</label>
        <input id="qAddU" placeholder="Exact username"></div>
      <button class="btn btn-out" id="qAddGo" style="width:100%;margin-bottom:6px">Add account</button>
      <div class="modal-actions"><button class="btn btn-out" id="b1X">Cancel</button>
        <button class="btn btn-solid" id="b1Next" disabled>Continue</button></div>`);
    $("#b1X").onclick = closeModal;
    const picks = () => document.querySelectorAll(".recv-pick");
    const select = id => {
      state2.recv = accts.find(a => String(a.id) === String(id));
      picks().forEach(p => p.setAttribute("aria-pressed", p.dataset.r === String(id)));
      $("#b1Next").disabled = false;
    };
    picks().forEach(p => p.onclick = () => select(p.dataset.r));
    const addGo = () => busy($("#qAddGo"), async () => {
      const n = $("#qAddU").value.trim();
      if (!n) throw new Error("Enter a Roblox username.");
      await api("/account/receiving", { method: "POST", body: { username: n } });
      await refreshMe(); toast("Account added.", "good"); renderStep1();
    });
    $("#qAddGo").onclick = addGo;
    $("#qAddU").onkeydown = e => { if (e.key === "Enter") addGo(); };
    $("#b1Next").onclick = () => { if (state2.recv) renderStep2(); };
  }

  function renderStep2() {
    const methods = (l.paymentMethods && l.paymentMethods.length) ? l.paymentMethods : PAYMENT_METHODS;
    openModal(`<h2>How is the seller getting paid?</h2>
      <p class="lede">Pick the method this seller accepts for ${esc(l.name)}.</p>
      ${stepDots(2)}
      <div class="pm-tiles">${methods.map(m => `<button class="pm-tile" data-m="${m}">
        ${PAY_ICON[m] || ""}<b>${m}</b></button>`).join("")}</div>
      <p class="note info" style="margin-top:14px">This just tells us which rail the seller expects — your
        BloxSwap buyer balance is what actually gets spent. It isn't a separate charge.</p>
      <div class="modal-actions"><button class="btn btn-out" id="b2Back">Back</button>
        <button class="btn btn-solid" id="b2Next" disabled>Continue</button></div>`);
    $("#b2Back").onclick = renderStep1;
    document.querySelectorAll(".pm-tile").forEach(t => t.onclick = () => {
      state2.method = t.dataset.m;
      document.querySelectorAll(".pm-tile").forEach(x => x.setAttribute("aria-pressed", x === t));
      $("#b2Next").disabled = false;
    });
    $("#b2Next").onclick = () => { if (state2.method) renderStep3(); };
  }

  function renderStep3() {
    const after = ME.buyerBalance - l.price;
    openModal(`<h2>Confirm your purchase</h2>
      <p class="lede">${esc(l.name)}</p>
      ${stepDots(3)}
      <div class="recv-row" style="border:1px solid var(--line);border-radius:11px;margin-bottom:10px">
        <img src="${userImg(state2.recv.id)}" alt="" onerror="this.style.visibility='hidden'">
        <div class="rn"><b>${esc(state2.recv.name)}</b><span>Receiving account</span></div>
      </div>
      <div class="pm-check" aria-pressed="true" style="margin-bottom:14px;cursor:default">
        ${PAY_ICON[state2.method] || ""}<b>${state2.method}</b>
        <span style="margin-left:auto;font-size:12px;color:var(--muted)">Seller's payment method</span>
      </div>
      <dl class="figrow" style="margin-bottom:12px">
        <div class="fig"><dt>Price</dt><dd class="num">${money(l.price)}</dd></div>
        <div class="fig"><dt>Buyer balance after</dt><dd class="num">${money(after)}</dd></div>
      </dl>
      <p class="note ${after < 0 ? "bad" : "info"}" style="margin:0">${after < 0
        ? "That's more than your buyer balance — top up before confirming."
        : `Your money goes into escrow now. The seller is only paid after you confirm the item arrived on
           ${esc(state2.recv.name)}, and you get ${l.warrantyHours} hours of warranty after that.`}</p>
      <div class="modal-actions"><button class="btn btn-out" id="b3Back">Back</button>
        <button class="btn btn-solid" id="b3Ok"${after < 0 ? " disabled" : ""}>Pay ${money(l.price)}</button></div>`);
    $("#b3Back").onclick = renderStep2;
    $("#b3Ok").onclick = () => busy($("#b3Ok"), async () => {
      await api("/orders", { method: "POST", body: {
        listingId: l.id, receivingId: state2.recv.id, paymentMethod: state2.method } });
      await refreshMe(); closeModal(); toast("Paid. Your order is in escrow.", "good");
      location.hash = "#/account/orders"; render(); paintSoldRail();
    });
  }

  renderStep1();
}

/* ===================== Raffles + recently sold ===================== */
let raffleTick = null;
function ago(t) {
  const s = (Date.now() - t) / 1000;
  return s < 60 ? "just now" : s < 3600 ? Math.floor(s / 60) + "m"
    : s < 86400 ? Math.floor(s / 3600) + "h" : Math.floor(s / 86400) + "d";
}

/* Live raffle banner — real entries, real countdown. */
async function paintRaffleStrip() {
  const box = $("#raffleStrip"); if (!box) return;
  clearInterval(raffleTick);
  let d;
  try { d = await api("/raffles"); } catch { return; }
  const r = d.raffles.find(x => x.status === "open") || d.raffles.find(x => x.status === "drawn");
  if (!r) { box.innerHTML = ""; return; }
  const live = r.status === "open";
  box.innerHTML = `<div class="raffle">
    <div class="rimg"><img src="${assetImg(r.assetId)}" alt="" onerror="this.remove()"></div>
    <div class="rmain">
      <span class="rlab">${live ? "<i></i>Raffle live" : "Raffle finished"}</span>
      <h3>${esc(r.name)}</h3>
      <p class="rmeta">${r.entries} ${r.entries === 1 ? "entry" : "entries"}${r.maxEntries ? ` of ${r.maxEntries}` : ""}${r.winner ? ` \u00b7 won by ${esc(r.winner.name)}` : ""}${r.note ? ` \u00b7 ${esc(r.note)}` : ""}</p>
      ${r.maxEntries ? `<div class="rbar"><span style="width:${Math.min(100, r.entries / r.maxEntries * 100)}%"></span></div>` : ""}
    </div>
    <div class="rcta">
      ${live ? `<span class="rclock" id="rclock"></span>
        <button class="btn btn-solid" data-join="${r.id}"${r.joined ? " disabled" : ""}>${r.joined ? "You're entered" : "Enter free"}</button>`
      : `<a class="btn btn-out" href="#/raffles">See raffles</a>`}
    </div></div>`;
  if (live) {
    const tick = () => {
      const el = $("#rclock"); if (!el) { clearInterval(raffleTick); return; }
      const ms = r.endsAt - Date.now();
      if (ms <= 0) { el.textContent = "Closing\u2026"; clearInterval(raffleTick); return; }
      const h = Math.floor(ms / 36e5), m = Math.floor(ms % 36e5 / 6e4), sec = Math.floor(ms % 6e4 / 1000);
      el.textContent = h > 0 ? `${h}h ${String(m).padStart(2, "0")}m` : `${m}m ${String(sec).padStart(2, "0")}s`;
    };
    tick(); raffleTick = setInterval(tick, 1000);
    const btn = box.querySelector("[data-join]");
    if (btn && !r.joined) btn.onclick = () => busy(btn, async () => {
      await api(`/raffles/${r.id}/join`, { method: "POST" });
      toast("You're in. Good luck.", "good"); paintRaffleStrip();
    });
  }
}

/* Recently sold \u2014 genuine completed orders, nothing simulated. */
let soldNewestAt = 0, soldTimer = null;
async function paintSoldRail(isPoll) {
  const box = $("#soldRail"); if (!box) return;
  let d;
  try { d = await api("/sold"); } catch { return; }
  if (!d.sold.length) { box.innerHTML = ""; soldNewestAt = 0; return; }
  const newest = d.sold[0].at;
  const fresh = isPoll && newest > soldNewestAt;   // something sold since last look
  soldNewestAt = newest;
  const card = (x, i) => `<div class="sc${i === 0 ? " sc-new" : ""}">
      <div class="si"><img src="${assetImg(x.assetId)}" alt="" loading="lazy" onerror="this.remove()"></div>
      <div class="sb"><p class="sn" title="${esc(x.name)}">${esc(x.name)}</p>
        <p class="sp num">${money(x.price)}</p><p class="st">${ago(x.at)} ago</p></div>
    </div>`;
  const cards = d.sold.map(card).join("");
  /* The track holds the list twice so the loop seam is invisible (scrolls exactly half). */
  const dur = Math.max(18, d.sold.length * 3.2);
  box.innerHTML = `<div class="sold-h"><h2>Recently sold</h2>
      <span>${d.sold.length} recent trade${d.sold.length === 1 ? "" : "s"}</span></div>
    <div class="sold"><div class="sold-track" style="--sold-dur:${dur}s">${cards}${cards}</div></div>`;
  if (fresh) {
    box.querySelectorAll(".sc-new").forEach(el => { el.classList.remove("sc-new"); void el.offsetWidth; el.classList.add("sc-new"); });
    toast("Someone just bought " + d.sold[0].name, "good");
  }
  // keep the rail live while you're on the catalog
  clearInterval(soldTimer);
  soldTimer = setInterval(() => {
    if (currentPage() === "limiteds") paintSoldRail(true); else clearInterval(soldTimer);
  }, 15000);
}

function orderRows(rows, mode) {
  if (!rows.length) return `<p style="color:var(--muted);font-size:14px">Nothing here yet.</p>`;
  return `<div class="tablewrap flat"><table>
    <thead><tr><th>Item</th><th>${mode === "buy" ? "Seller" : "Buyer — trade this Roblox account"}</th>
      <th>Amount</th><th>Status</th><th>Warranty</th><th></th></tr></thead>
    <tbody>${rows.map(o => {
      const warr = o.status === "complete" && o.warrantyEnds > Date.now() ? `ends ${fmtDate(o.warrantyEnds)}`
        : o.status === "complete" ? "expired" : "starts on delivery";
      let act = "";
      if (mode === "buy" && ["escrow", "delivered"].includes(o.status))
        act = `<button class="btn btn-solid btn-sm" data-confirm="${o.id}" data-n="${esc(o.name)}" data-p="${o.payout}">Confirm received</button>`;
      else if (mode === "buy" && o.status === "complete" && o.warrantyEnds > Date.now() && !o.hasClaim)
        act = `<button class="btn btn-out btn-sm" data-claim="${o.id}">Warranty claim</button>`;
      else if (mode === "sell" && o.status === "escrow")
        act = `<button class="btn btn-out btn-sm" data-deliver="${o.id}" data-n="${esc(o.name)}">Mark delivered</button>`;
      const who = o.counterpartyRoblox
        ? `<b style="font-size:14px">${esc(o.counterpartyRoblox.name)}</b>
           <div class="uid" style="font-size:11.5px">Roblox ID ${o.counterpartyRoblox.id} · Seller#${o.counterparty}</div>`
        : `<b>Seller#${o.counterparty}</b><div class="uid" style="font-size:11.5px;color:var(--warn)">no Roblox account linked</div>`;
      return `<tr><td><b>${esc(o.name)}</b>${o.serial ? `<div class="uid" style="font-size:11.5px">serial #${o.serial}</div>` : ""}</td>
        <td>${who}</td>
        <td class="num">${money(mode === "buy" ? o.price : o.payout)}</td>
        <td><span class="tag ${o.status === "complete" ? "ok" : o.status === "refunded" ? "proj" : "neutral"}">${o.status}</span></td>
        <td style="color:var(--muted)">${warr}</td><td>${act}</td></tr>`;
    }).join("")}</tbody></table></div>`;
}

    });
  });
}

  $("#invBody").querySelectorAll("[data-list]").forEach(b => b.onclick = () => {

    const picked = new Set(PAYMENT_METHODS);
    openModal(`<h2>List ${esc(c.name)}</h2>
      <p class="lede">${c.serial ? "Serial #" + c.serial + " · " : ""}RAP ${rbx(c.rap)}${c.value > 0 ? " · value " + rbx(c.value) : ""}</p>
      <div class="field"><label for="lpx">Your price (USD)</label>
        <input id="lpx" type="number" min="0.5" step="0.01" placeholder="0.00" autofocus></div>
      <div class="note info" id="lFee">Commission ${SET.commissionPct}% is taken when it sells.</div>
      <div class="field" style="margin-top:14px"><label>Payment methods you accept</label>
        <div class="pm-tiles" id="lMethods">${PAYMENT_METHODS.map(m => `<button type="button" class="pm-tile" data-m="${m}" aria-pressed="true">
          ${PAY_ICON[m] || ""}<b>${m}</b></button>`).join("")}</div>
        <span class="hint">Buyers will only see the ones you leave selected.</span></div>
      <p class="note" style="margin-top:14px">Listing doesn't lock the item. If you trade it away elsewhere, take the
        listing down.</p>
      <div class="modal-actions"><button class="btn btn-out" id="lX">Cancel</button>
        <button class="btn btn-solid" id="lOk">Review listing</button></div>`);
    $("#lX").onclick = closeModal;
    $("#lpx").oninput = e => {
      const p = +e.target.value || 0, f = Math.round(p * SET.commissionPct) / 100;
      $("#lFee").innerHTML = `Commission ${SET.commissionPct}% — you receive <b>${money(p - f)}</b> of ${money(p)}.`;
    };
    document.querySelectorAll("#lMethods .pm-tile").forEach(t => t.onclick = () => {
      const m = t.dataset.m;
      if (picked.has(m)) { if (picked.size > 1) picked.delete(m); }
      else picked.add(m);
      t.setAttribute("aria-pressed", picked.has(m));
    });
    $("#lOk").onclick = async () => {
      const p = +$("#lpx").value;
      if (!(p > 0)) return toast("Enter a price.", "bad");
      const f = Math.round(p * SET.commissionPct) / 100;
      const methods = [...picked];
      closeModal();
      if (!await ask({ title: "Publish this listing?", ok: "Publish at " + money(p),
        body: `<p style="margin-bottom:12px"><b>${esc(c.name)}</b>${c.serial ? " · serial #" + c.serial : ""}</p>
          <dl class="figrow" style="margin-bottom:12px">
            <div class="fig"><dt>Buyer pays</dt><dd class="num">${money(p)}</dd></div>
            <div class="fig"><dt>You receive</dt><dd class="num">${money(p - f)}</dd></div></dl>
          <p style="margin-bottom:10px;font-size:13.5px;color:var(--ink-2)">Accepting: ${methods.join(", ")}</p>
          <p class="note bad" style="margin:0">Once someone buys, you're expected to send the item. Not delivering gets
          the order refunded and can suspend your account.</p>` })) return;
      try {
        await api("/listings", { method: "POST", body: { uaid: c.uaid, price: p, paymentMethods: methods } });
        toast("Listing published.", "good"); location.hash = "#/account/listings"; render();
      } catch (e) { toast(e.message, "bad"); }
    };
  });
}

function newTicketModal(categories) {
  openModal(`<h2>Open a ticket</h2><p class="lede">Give us enough to work with and we'll get straight to it.</p>
    <div class="field"><label for="tkCat">What's it about?</label><select id="tkCat">

  $("#tkOk").onclick = () => busy($("#tkOk"), async () => {

async function openTicket(no) {
  const d = await api("/tickets/" + no).catch(() => null);
  if (UNREAD) { refreshMe().then(() => paintChrome("support")).catch(() => {}); }
  if (!d) { view.innerHTML = `<div class="empty" style="margin-top:40px"><h3>Ticket not found</h3>
    <p>It may belong to another account.</p><a class="btn btn-solid" href="#/support">Back to tickets</a></div>`; return; }
  const t = d.ticket;
  view.innerHTML = `<section class="page">
    <nav class="crumbs"><a href="#/support">Tickets</a> / <span>${t.no}</span></nav>
    <div class="chat">
      <div class="chat-head"><b>${esc(t.subject)}</b>
        <span class="tag ${STATUS_TAG[t.status]}">${t.status}</span>
        <span class="uid" style="margin-left:auto">${t.no} · ${esc(t.category)}</span></div>
      <div class="chat-log" id="tkLog"></div>
      ${t.status === "closed" ? `<div style="padding:14px;border-top:1px solid var(--line);color:var(--muted);font-size:14px">
          This ticket is closed. <a href="#/support" style="color:var(--accent-ink);font-weight:600">Open a new one</a> if you still need help.</div>`
        : `<form class="chat-form" id="tkForm"><input id="tkInput" placeholder="Type your reply…" autocomplete="off" maxlength="2000">
            <button class="btn btn-solid" type="submit">Send</button></form>`}
    </div>
    ${t.status !== "closed" ? `<div class="actions" style="margin-top:12px">
      <button class="btn btn-out btn-sm" id="tkClose">Close this ticket</button></div>` : ""}
  </section>`;
  paintTicket(t.messages);
  if ($("#tkForm")) $("#tkForm").onsubmit = async e => {
    e.preventDefault();
    const input = $("#tkInput"), text = input.value.trim();
    if (!text) return;
    input.value = "";
    try { const r = await api(`/tickets/${no}/reply`, { method: "POST", body: { text } }); paintTicket(r.ticket.messages); }
    catch (err) { toast(err.message, "bad"); }
  };
  if ($("#tkClose")) $("#tkClose").onclick = async () => {
    if (!await ask({ title: "Close this ticket?", ok: "Close ticket",
      body: "<p>You can always open a new one if the problem comes back.</p>" })) return;
    await api(`/tickets/${no}/close`, { method: "POST" }); toast("Ticket closed."); render();
  };
  clearInterval(ticketTimer);
  ticketTimer = setInterval(async () => {
    if (!location.hash.startsWith("#/support/")) return clearInterval(ticketTimer);
    try { const r = await api("/tickets/" + no); paintTicket(r.ticket.messages); } catch {}
  }, 7000);
}
function paintTicket(messages) {
  const log = $("#tkLog"); if (!log) return;
  const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 60;
  log.innerHTML = messages.map(m => `<div class="msg ${m.from === "user" ? "mine" : "them"}">${esc(m.text)}
    <time>${m.from === "user" ? "You" : "Support"} · ${fmtTime(m.t)}</time></div>`).join("");
  if (atBottom) log.scrollTop = log.scrollHeight;
}
